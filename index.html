<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Layerdle">
<meta name="theme-color" content="#0e0d14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Layerdle</title>
<style>
  :root {
    --bg: #0e0d14;
    --panel: #1a1826;
    --panel-2: #24213a;
    --line: #322e4d;
    --text: #f3f1ff;
    --muted: #9d98b8;
    --accent: #ff5c8a;
    --accent-2: #7c5cff;
    --ok: #3ddc97;
    --gold: #ffcc4d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { -webkit-user-select: text; user-select: text; }
  [hidden] { display: none !important; }

  .app {
    max-width: 520px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .screen { display: flex; flex-direction: column; gap: 14px; min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 30px); }

  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  h2 { margin: 8px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .grad {
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img { width: 52px; height: 52px; border-radius: 13px; }
  .sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }

  .note {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; color: var(--muted);
  }

  .resume {
    background: var(--panel-2); border: 2px solid var(--accent); border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .resume b { font-size: 18px; }
  .resume p { margin: 0; color: var(--muted); font-size: 14px; }
  .resume .scorebar { flex-wrap: wrap; }
  .resume .btn.primary { color: var(--text); }

  .team-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .team-tag {
    background: var(--c); color: #14121c;
    border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px;
  }

  .cats { display: flex; flex-direction: column; gap: 8px; }
  .cat {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 12px 12px 12px 14px;
    border-radius: 14px; border: 2px solid transparent;
    background: var(--panel);
  }
  .cat.on { border-color: var(--accent); background: var(--panel-2); }
  .cat .name { flex: 1; }
  .cat .name b { display: block; font-size: 16px; }
  .cat .name span { font-size: 13px; color: var(--muted); }
  .save {
    border: 1px solid var(--line); background: var(--bg);
    border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .save.done { color: var(--ok); border-color: transparent; background: transparent; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--panel); padding: 4px; border-radius: 12px; }
  .seg button { border: 0; background: transparent; padding: 10px 4px; border-radius: 9px; color: var(--muted); font-weight: 700; }
  .seg button.on { background: var(--panel-2); color: var(--text); }

  .btn { border: 0; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 16px; background: var(--panel-2); }
  .btn.primary { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .btn.ghost { background: var(--panel); border: 1px solid var(--line); }
  .btn.big { padding: 20px; font-size: 19px; width: 100%; }
  .btn.small { padding: 12px 16px; }
  .btn:disabled { opacity: 0.4; }
  .foot-link { align-self: center; color: var(--muted); font-size: 13px; padding: 4px 8px; }
  .link { border: 0; background: transparent; color: var(--muted); font-size: 15px; padding: 8px; }
  .push { margin-top: auto; }

  /* Round */
  .round-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 600; }
  .scorebar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .scorebar span { flex: none; background: var(--c); color: #14121c; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
  .scorebar b { margin-left: 6px; font-size: 16px; }

  .layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .layer {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; border-radius: 12px;
    background: var(--panel); border: 2px solid transparent; font-size: 15px;
  }
  .layer .ic { width: 26px; text-align: center; font-size: 19px; }
  .layer .nm { flex: 1; font-weight: 700; }
  .layer .pt { font-size: 13px; color: var(--muted); }
  .layer.locked { opacity: 0.35; }
  .layer.current { border-color: var(--accent); background: var(--panel-2); }
  .layer.current .pt { color: var(--gold); font-weight: 700; }
  .layer.playing { box-shadow: inset 0 0 0 2px var(--accent-2); }

  .hint {
    background: rgba(124, 92, 255, 0.14); border: 1px solid rgba(124, 92, 255, 0.45);
    border-radius: 12px; padding: 12px 14px; font-size: 16px; text-align: center;
  }
  .answer { text-align: center; background: var(--panel); border-radius: var(--radius); padding: 16px; }
  .answer .t { font-size: 24px; font-weight: 800; }
  .answer .m { color: var(--muted); font-size: 16px; margin-top: 4px; }

  .player { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; }
  .play {
    --p: 0;
    position: relative; width: 88px; height: 88px;
    border-radius: 50%; border: 0; padding: 0;
    background: conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--panel-2) 0);
    display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(255, 92, 138, 0.18);
  }
  .play::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: linear-gradient(145deg, var(--accent-2), var(--accent)); }
  .play span { position: relative; font-size: 36px; line-height: 1; }
  .play.loading span { animation: pulse 0.8s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
  .play-label { color: var(--muted); font-size: 15px; }

  .peek {
    align-self: center;
    min-width: 220px; max-width: 100%;
    border: 1px dashed var(--line); background: var(--panel);
    border-radius: 999px; padding: 10px 18px;
    color: var(--muted); font-size: 15px; font-weight: 600;
    -webkit-touch-callout: none; touch-action: none;
  }
  .peek.on { border-style: solid; border-color: var(--gold); color: var(--text); font-size: 13px; }

  .controls, .award { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .controls .gap { height: 18px; } /* keep Next well away from Reveal so nobody hits Reveal by accident */
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-2 .btn { padding: 15px 10px; font-size: 16px; color: var(--muted); }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode {
    text-align: left; padding: 14px; border-radius: 14px;
    border: 2px solid transparent; background: var(--panel);
  }
  .mode.on { border-color: var(--accent); background: var(--panel-2); }
  .mode .i { font-size: 24px; }
  .mode b { display: block; font-size: 16px; margin-top: 4px; }
  .mode span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .award p { margin: 0; text-align: center; font-weight: 800; font-size: 18px; }
  .award-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .award-btns .btn { padding: 18px 10px; font-size: 18px; background: var(--c); color: #14121c; }
  .award-btns .btn small { display: block; font-size: 14px; margin-top: 2px; opacity: 0.75; }
  .award-btns .nobody { grid-column: 1 / -1; background: var(--panel); color: var(--muted); }

  /* End */
  .trophy { text-align: center; font-size: 64px; margin-top: 20px; }
  .end-title { text-align: center; font-size: 30px; }
  .standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .standings li { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 14px; padding: 14px 16px; font-size: 18px; font-weight: 700; }
  .standings li .pts { margin-left: auto; color: var(--gold); }
  .standings .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
  .standings li:first-child { background: var(--panel-2); border: 2px solid var(--gold); }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 999px;
    font-weight: 700; font-size: 15px; z-index: 30; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Setup -->
  <section id="setup" class="screen">
    <header class="hero">
      <img src="icon-180.png" alt="">
      <div>
        <h1 class="grad">Layerdle</h1>
        <p class="sub">Party mode · name that song</p>
      </div>
    </header>

    <div id="net" class="note" hidden>📴 You're offline. Only songs saved for offline will play.</div>
    <div id="empty" class="note" hidden>No songs yet. Add some with add_songs.cmd.</div>

    <div id="resume" class="resume" hidden>
      <b>Continue game?</b>
      <p id="resume-info"></p>
      <div id="resume-scores" class="scorebar"></div>
      <div class="row-2">
        <button id="resume-no" class="btn ghost">Discard</button>
        <button id="resume-yes" class="btn primary">Continue ➜</button>
      </div>
    </div>

    <h2>Game mode</h2>
    <div id="modes" class="modes"></div>

    <h2>How many teams?</h2>
    <div id="team-count" class="seg"></div>
    <div id="team-list" class="team-list"></div>

    <h2>Category</h2>
    <div id="cats" class="cats"></div>

    <h2>Songs per game</h2>
    <div id="rounds" class="seg"></div>

    <button id="start" class="btn primary big push">Start game</button>
    <a href="review.html" class="foot-link">Review clips</a>
  </section>

  <!-- Round -->
  <section id="round" class="screen" hidden>
    <div class="round-top">
      <button id="quit" class="link">✕ End game</button>
      <span id="round-count"></span>
    </div>
    <div id="scorebar" class="scorebar"></div>
    <ol id="layers" class="layers"></ol>
    <div id="hint" class="hint" hidden></div>
    <div id="answer" class="answer" hidden><div class="t"></div><div class="m"></div></div>
    <div class="player">
      <button id="play" class="play" aria-label="Play"><span id="play-icon">▶</span></button>
      <div id="play-label" class="play-label"></div>
    </div>
    <button id="peek" class="peek">👁 Hold to peek at the answer</button>
    <div id="controls" class="controls">
      <button id="next" class="btn primary big">Next layer</button>
      <div class="gap"></div>
      <div class="row-2">
        <button id="skip-song" class="btn ghost">Skip song</button>
        <button id="reveal" class="btn ghost">Reveal answer</button>
      </div>
    </div>
    <div id="award" class="award" hidden>
      <p>Who got it?</p>
      <div id="award-btns" class="award-btns"></div>
    </div>
  </section>

  <!-- End -->
  <section id="end" class="screen" hidden>
    <div class="trophy">🏆</div>
    <h1 id="winner" class="end-title"></h1>
    <ol id="standings" class="standings"></ol>
    <div class="controls">
      <button id="again" class="btn primary big">Play again</button>
      <button id="home" class="btn ghost big">Change setup</button>
    </div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const STAGES = {
    4: [['🥁', 'Drums'], ['🎸', '+ Bass'], ['🎹', '+ Instruments'], ['🎤', '+ Vocals']],
    5: [['🥁', 'Drums'], ['🎸', '+ Bass'], ['🎹', '+ Instruments'], ['🔇', '+ Muffled vocals'], ['🎤', '+ Vocals']],
  };
  const MODES = {
    layers: { icon: '🎚️', name: 'Layer by Layer', desc: 'Drums first, then add a layer' },
    nfn: { icon: '⏱️', name: 'Note for Note', desc: '1 second, then 2, 3, 4, 5, 10' },
  };
  const NFN_SECONDS = [1, 2, 3, 4, 5, 10];
  const ROUND_OPTIONS = [5, 10, 20, 'all'];
  const TEAMS = [['Red', '#ff5c6c'], ['Blue', '#4da3ff'], ['Green', '#3ddc97'], ['Yellow', '#ffcc4d'], ['Purple', '#b18cff'], ['Orange', '#ff9a3d']];
  const teamColor = name => (TEAMS.find(([n]) => n === name) || [, '#9d98b8'])[1];
  const CLIP_CACHE = 'layerdle-clips';

  /* ---------- Settings (per device) ---------- */
  const KEY = 'layerdle:party';
  let prefs;
  try { prefs = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { prefs = {}; }
  prefs.teams = prefs.teams || 2;
  prefs.mode = MODES[prefs.mode] ? prefs.mode : 'layers';
  prefs.category = prefs.category || 'All songs';
  prefs.rounds = prefs.rounds || 10;
  prefs.played = prefs.played || [];
  const savePrefs = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} };

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.hidden = true; }, 2000);
  }
  function show(id) {
    ['setup', 'round', 'end'].forEach(s => { $('#' + s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /* ---------- Song library ---------- */
  let SONGS = [];
  async function loadLibrary() {
    try {
      const r = await fetch('songs.json', { cache: 'no-cache' });
      if (r.ok) SONGS = ((await r.json()).songs || []).filter(s => s.clips && s.clips.length);
    } catch (e) {}
  }
  // Songs processed before Note for Note existed have no nfn clip, so they only play in Layer by Layer.
  const inMode = s => prefs.mode !== 'nfn' || !!s.nfn;
  function categories() {
    const songs = SONGS.filter(inMode), map = new Map();
    songs.forEach(s => (s.categories || []).forEach(c => {
      if (!map.has(c)) map.set(c, []);
      map.get(c).push(s);
    }));
    return [['All songs', songs], ...[...map].sort((a, b) => a[0].localeCompare(b[0]))];
  }
  const poolFor = name => (categories().find(([n]) => n === name) || categories()[0])[1];

  /* ---------- Offline clips ---------- */
  const canCache = 'caches' in window;
  const abs = u => new URL(u, location.href).href;
  let cached = new Set();
  const downloads = new Map(); // category -> progress 0..1
  const songUrls = s => [...s.clips, s.nfn].filter(Boolean).map(abs); // both modes, so either works offline
  const songSaved = s => songUrls(s).every(u => cached.has(u));

  async function refreshCached() {
    if (!canCache) return;
    try {
      const cache = await caches.open(CLIP_CACHE);
      // Drop clips the library no longer uses (old versions of re-processed songs, removed songs).
      const live = new Set(SONGS.flatMap(songUrls));
      const keys = await cache.keys();
      if (live.size) await Promise.all(keys.filter(r => !live.has(r.url)).map(r => cache.delete(r)));
      cached = new Set(keys.map(r => r.url).filter(u => live.has(u)));
    } catch (e) {}
  }
  async function saveOffline(name) {
    if (downloads.has(name)) return;
    if (!navigator.onLine) { toast('Connect to the internet to download'); return; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    const cache = await caches.open(CLIP_CACHE);
    const urls = [...new Set(poolFor(name).flatMap(songUrls))].filter(u => !cached.has(u));
    const total = urls.length || 1;
    let done = 0, failed = 0;
    downloads.set(name, 0);
    renderCats();
    const worker = async () => {
      while (urls.length) {
        const u = urls.shift();
        try {
          const r = await fetch(u, { cache: 'no-store' });
          if (!r.ok) throw new Error(r.status);
          await cache.put(u, r);
          cached.add(u);
        } catch (e) { failed++; }
        downloads.set(name, ++done / total);
        renderCats();
      }
    };
    await Promise.all([1, 2, 3, 4].map(worker));
    downloads.delete(name);
    renderCats();
    toast(failed ? `${failed} clips failed. Tap again to retry` : `${name} saved for offline`);
  }

  /* ---------- Setup screen ---------- */
  function renderModes() {
    $('#modes').innerHTML = Object.entries(MODES).map(([id, m]) =>
      `<button class="mode${id === prefs.mode ? ' on' : ''}" data-mode="${id}"><span class="i">${m.icon}</span><b>${m.name}</b><span>${m.desc}</span></button>`).join('');
  }
  function renderTeams() {
    $('#team-count').innerHTML = TEAMS.map((_, i) =>
      `<button data-t="${i + 1}" class="${i + 1 === prefs.teams ? 'on' : ''}">${i + 1}</button>`).join('');
    $('#team-list').innerHTML = TEAMS.slice(0, prefs.teams).map(([n, c]) =>
      `<span class="team-tag" style="--c:${c}">${n}</span>`).join('');
  }
  function renderCats() {
    $('#cats').innerHTML = categories().map(([name, songs]) => {
      const saved = songs.filter(songSaved).length;
      let btn = '';
      if (canCache && songs.length) {
        if (downloads.has(name)) btn = `<span class="save">${Math.round(downloads.get(name) * 100)}%</span>`;
        else if (saved === songs.length) btn = `<span class="save done">✓ Offline</span>`;
        else btn = `<span class="save" data-save="${esc(name)}">⬇ Save${saved ? ` (${saved}/${songs.length})` : ''}</span>`;
      }
      return `<button class="cat${name === prefs.category ? ' on' : ''}" data-cat="${esc(name)}">
        <span class="name"><b>${esc(name)}</b><span>${songs.length} song${songs.length === 1 ? '' : 's'}</span></span>${btn}</button>`;
    }).join('');
  }
  function renderRounds() {
    $('#rounds').innerHTML = ROUND_OPTIONS.map(r =>
      `<button data-r="${r}" class="${String(r) === String(prefs.rounds) ? 'on' : ''}">${r === 'all' ? 'All' : r}</button>`).join('');
  }
  function renderSetup() {
    if (!poolFor(prefs.category).length || !categories().some(([n]) => n === prefs.category)) prefs.category = 'All songs';
    renderModes(); renderTeams(); renderCats(); renderRounds();
    $('#net').hidden = navigator.onLine;
    $('#empty').hidden = SONGS.length > 0;
    renderResume();
  }

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (!b) return;
    prefs.mode = b.dataset.mode;
    savePrefs(); renderSetup();
  });

  $('#team-count').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]');
    if (!b) return;
    prefs.teams = +b.dataset.t;
    savePrefs(); renderTeams();
  });
  $('#cats').addEventListener('click', e => {
    const save = e.target.closest('[data-save]');
    if (save) { saveOffline(save.dataset.save); return; }
    const cat = e.target.closest('[data-cat]');
    if (cat) { prefs.category = cat.dataset.cat; savePrefs(); renderCats(); }
  });
  $('#rounds').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]');
    if (!b) return;
    prefs.rounds = b.dataset.r === 'all' ? 'all' : +b.dataset.r;
    savePrefs(); renderRounds();
  });
  window.addEventListener('online', renderSetup);
  window.addEventListener('offline', renderSetup);

  /* ---------- Audio ---------- */
  let ctx = null, unlocked = false, playing = null, pending = null, raf = 0;
  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Play even when the iPhone's silent switch is on (Safari 17+).
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    return ctx;
  }
  // Must run synchronously inside a tap so iOS allows audio.
  function unlockCtx() {
    const c = ensureCtx();
    if (c.state !== 'running') c.resume();
    if (!unlocked) {
      const s = c.createBufferSource();
      s.buffer = c.createBuffer(1, 1, 22050);
      s.connect(c.destination); s.start(0);
      unlocked = true;
    }
    return c;
  }

  const clipCache = new Map();
  function loadClip(url) {
    if (!clipCache.has(url)) {
      const p = fetch(url)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then(ab => new Promise((res, rej) => ensureCtx().decodeAudioData(ab, res, rej)));
      p.catch(() => clipCache.delete(url));
      clipCache.set(url, p);
    }
    return clipCache.get(url);
  }

  function setPlayUI(mode, idx) {
    $('#play').classList.toggle('loading', mode === 'loading');
    $('#play-icon').textContent = mode === 'idle' ? '▶' : '■';
    if (mode === 'idle') $('#play').style.setProperty('--p', 0);
    document.querySelectorAll('.layer').forEach((el, i) => el.classList.toggle('playing', mode !== 'idle' && i === idx));
  }
  function stopAudio() {
    pending = null;
    if (playing) {
      playing.src.onended = null;
      try { playing.src.stop(); } catch (e) {}
      playing = null;
    }
    cancelAnimationFrame(raf);
    setPlayUI('idle');
  }
  // idx: a stage number, or 'full' for the reveal. force: always (re)start; otherwise a
  // second tap on the playing clip stops it.
  async function playClip(idx, force) {
    const c = unlockCtx();
    const was = playing ? playing.idx : pending ? pending.idx : null;
    stopAudio();
    if (!force && was === idx) return;
    const token = pending = { idx };
    setPlayUI('loading', idx);
    const spec = clipSpec(idx);
    let buf;
    try { buf = await loadClip(spec.url); }
    catch (e) {
      if (pending === token) { pending = null; setPlayUI('idle'); toast(navigator.onLine ? 'Could not load this clip' : 'Not saved offline. Skip this song'); }
      return;
    }
    if (pending !== token) return;
    pending = null;
    const dur = Math.min(spec.dur || buf.duration, buf.duration);
    const src = c.createBufferSource(), gain = c.createGain();
    src.buffer = buf;
    src.connect(gain).connect(c.destination);
    const t = c.currentTime;
    if (spec.dur) { // cut short (Note for Note): quick fade so it doesn't click
      gain.gain.setValueAtTime(1, t + dur - 0.04);
      gain.gain.linearRampToValueAtTime(0, t + dur);
    }
    src.onended = () => { if (playing && playing.src === src) stopAudio(); };
    src.start(t, 0, dur);
    playing = { src, idx, start: t, dur };
    setPlayUI('playing', idx);
    const tick = () => {
      if (!playing) return;
      $('#play').style.setProperty('--p', Math.min(1, (c.currentTime - playing.start) / playing.dur));
      raf = requestAnimationFrame(tick);
    };
    tick();
  }

  /* ---------- Keep the screen on during a game ---------- */
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release(); wakeLock = null;
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && game && !$('#round').hidden) keepAwake(true);
  });

  /* ---------- Game ---------- */
  let game = null;
  const isNfn = () => game.mode === 'nfn';
  const nClips = s => s.clips.length;
  const nStages = s => isNfn() ? NFN_SECONDS.length : nClips(s) + 1; // layers: + hint stage
  const secs = n => `${n} second${n === 1 ? '' : 's'}`;
  function stageMeta(s, i) {
    if (isNfn()) return ['⏱️', secs(NFN_SECONDS[i])];
    if (i >= nClips(s)) return ['💡', 'Hint'];
    return (STAGES[nClips(s)] || [])[i] || (i === nClips(s) - 1 ? ['🎤', 'Full song'] : ['🎵', 'Layer ' + (i + 1)]);
  }
  const pointsAt = i => nStages(game.song) - i; // first stage is worth the most, last is worth 1
  const currentClip = () => game.revealed ? 'full' : isNfn() ? game.layer : Math.min(game.layer, nClips(game.song) - 1);
  function clipSpec(idx) {
    const s = game.song;
    if (idx === 'full') return { url: s.clips[nClips(s) - 1] };
    if (isNfn()) return { url: s.nfn, dur: NFN_SECONDS[idx] };
    return { url: s.clips[Math.min(idx, nClips(s) - 1)] };
  }

  function buildQueue() {
    let pool = poolFor(prefs.category); // already limited to songs that work in the chosen mode
    if (!navigator.onLine) pool = pool.filter(songSaved);
    const seen = id => prefs.played.indexOf(id);
    const fresh = shuffle(pool.filter(s => seen(s.id) < 0));
    const old = pool.filter(s => seen(s.id) >= 0).sort((a, b) => seen(a.id) - seen(b.id)); // least recently played first
    const n = prefs.rounds === 'all' ? pool.length : Math.min(prefs.rounds, pool.length);
    return fresh.concat(old).slice(0, n);
  }

  /* ---------- Resume: iOS often kills the app during a call or a sat-nav switch ---------- */
  const GAME_KEY = 'layerdle:game';
  const RESUME_MAX_AGE = 24 * 3600 * 1000;
  function saveGame() {
    const { mode, queue, i, layer, revealed, scores } = game;
    try {
      localStorage.setItem(GAME_KEY, JSON.stringify({ mode, ids: queue.map(s => s.id), i, layer, revealed, scores, at: Date.now() }));
    } catch (e) {}
  }
  const clearGame = () => { try { localStorage.removeItem(GAME_KEY); } catch (e) {} };
  function savedGame() {
    let g;
    try { g = JSON.parse(localStorage.getItem(GAME_KEY)); } catch (e) {}
    if (!g || !Array.isArray(g.ids) || Date.now() - g.at > RESUME_MAX_AGE) return null;
    // Songs removed from the library since are dropped; i shifts back for any that came before it.
    const byId = new Map(SONGS.map(s => [s.id, s]));
    const i = g.i - g.ids.slice(0, g.i).filter(id => !byId.has(id)).length;
    const keepPlace = byId.has(g.ids[g.i]);
    const queue = g.ids.map(id => byId.get(id)).filter(Boolean);
    if (i >= queue.length) return null;
    return { mode: MODES[g.mode] ? g.mode : 'layers', queue, i, scores: g.scores,
      layer: keepPlace ? g.layer || 0 : 0, revealed: keepPlace && !!g.revealed };
  }
  function renderResume() {
    const g = savedGame();
    $('#resume').hidden = !g;
    if (!g) return;
    $('#resume-info').textContent = `${MODES[g.mode].name} · song ${g.i + 1} of ${g.queue.length}`;
    $('#resume-scores').innerHTML = Object.entries(g.scores).map(([p, s]) => `<span style="--c:${teamColor(p)}">${esc(p)}<b>${s}</b></span>`).join('');
  }
  function resumeGame() {
    const g = savedGame();
    if (!g) { renderResume(); return; }
    unlockCtx();
    game = { ...g, song: g.queue[g.i] };
    keepAwake(true);
    show('round');
    renderRound();
    playClip(currentClip(), true);
  }

  function startGame() {
    const queue = buildQueue();
    if (!queue.length) { toast(navigator.onLine ? 'No songs in this category' : 'No songs saved offline'); return; }
    unlockCtx();
    game = { mode: prefs.mode, queue, i: 0, scores: Object.fromEntries(TEAMS.slice(0, prefs.teams).map(([n]) => [n, 0])) };
    keepAwake(true);
    show('round');
    startRound();
  }

  function startRound() {
    game.song = game.queue[game.i];
    game.layer = 0;
    game.revealed = false;
    saveGame();
    renderRound();
    playClip(0, true);
    // Warm up what's likely next: this song's following stage and reveal, and the next song's first clip.
    const next = game.queue[game.i + 1];
    if (next) loadClip(isNfn() ? next.nfn : next.clips[0]).catch(() => {});
    if (!isNfn()) loadClip(clipSpec(1).url).catch(() => {});
    loadClip(clipSpec('full').url).catch(() => {});
  }

  function renderRound() {
    const { song, layer, revealed } = game, n = nStages(song);
    $('#round-count').textContent = `Song ${game.i + 1} of ${game.queue.length}`;
    $('#scorebar').innerHTML = Object.entries(game.scores).map(([p, s]) => `<span style="--c:${teamColor(p)}">${esc(p)}<b>${s}</b></span>`).join('');

    $('#layers').innerHTML = Array.from({ length: n }, (_, i) => {
      const [icon, name] = stageMeta(song, i);
      const cls = revealed ? (i <= layer ? '' : 'locked') : i < layer ? '' : i === layer ? 'current' : 'locked';
      const playable = (isNfn() || i < nClips(song)) && (revealed || i <= layer);
      return `<li class="layer ${cls}" data-i="${playable ? i : ''}"><span class="ic">${icon}</span><span class="nm">${name}</span><span class="pt">${pointsAt(i)} pt${pointsAt(i) === 1 ? '' : 's'}</span></li>`;
    }).join('');

    const atHint = !isNfn() && layer >= nClips(song);
    $('#hint').hidden = !atHint || revealed;
    $('#hint').innerHTML = '💡 ' + [song.year ? `Released <b>${esc(song.year)}</b>` : '', `Artist starts with <b>“${esc((song.artist || '?')[0])}”</b>`].filter(Boolean).join(' · ');

    $('#answer').hidden = !revealed;
    $('#answer .t').textContent = song.title;
    $('#answer .m').textContent = [song.artist, song.year].filter(Boolean).join(' · ');

    $('#play-label').textContent = revealed ? 'Full song'
      : isNfn() ? stageMeta(song, layer)[1]
      : atHint ? 'Full song + hint' : layer === 0 ? 'Drums only' : stageMeta(song, layer)[1].replace('+ ', 'Added ');

    $('#controls').hidden = revealed;
    $('#peek').hidden = revealed;
    hidePeek();
    $('#next').disabled = layer >= n - 1;
    $('#next').textContent = layer >= n - 1 ? (isNfn() ? 'That was the longest' : 'No more layers')
      : isNfn() ? `Play ${secs(NFN_SECONDS[layer + 1])} ➜`
      : layer === nClips(song) - 1 ? 'Show hint ➜' : `Add ${stageMeta(song, layer + 1)[1].replace('+ ', '').toLowerCase()} ➜`;

    $('#award').hidden = !revealed;
    const pts = pointsAt(layer);
    $('#award-btns').innerHTML = Object.keys(game.scores).map(p =>
      `<button class="btn" style="--c:${teamColor(p)}" data-p="${esc(p)}">${esc(p)}<small>+${pts}</small></button>`).join('') +
      `<button class="btn nobody" data-p="">Nobody</button>`;
  }

  function nextLayer() {
    if (game.layer >= nStages(game.song) - 1) return;
    game.layer++;
    saveGame();
    renderRound();
    playClip(currentClip(), true);
  }
  function reveal() {
    game.revealed = true;
    saveGame();
    renderRound();
    playClip(currentClip(), true);
  }
  function finishRound(winner) {
    const pts = pointsAt(game.layer);
    if (winner) { game.scores[winner] += pts; toast(`+${pts} for ${winner}`); }
    const id = game.song.id;
    prefs.played = prefs.played.filter(x => x !== id).concat(id).slice(-500);
    savePrefs();
    game.i++;
    if (game.i >= game.queue.length) endGame();
    else startRound();
  }
  function endGame() {
    clearGame();
    stopAudio();
    keepAwake(false);
    const ranked = Object.entries(game.scores).sort((a, b) => b[1] - a[1]);
    const top = ranked.length ? ranked[0][1] : 0;
    const winners = ranked.filter(([, s]) => s === top).map(([p]) => p);
    $('#winner').textContent = top === 0 ? 'Nobody scored!' : winners.length > 1 ? `Tie: ${winners.join(' & ')}` : `${winners[0]} wins!`;
    const medal = ['🥇', '🥈', '🥉'];
    $('#standings').innerHTML = ranked.map(([p, s], i) => `<li><span>${medal[i] || ''}</span><span class="dot" style="--c:${teamColor(p)}"></span>${esc(p)}<span class="pts">${s}</span></li>`).join('');
    show('end');
  }

  $('#start').addEventListener('click', startGame);
  $('#play').addEventListener('click', () => playClip(currentClip()));
  $('#layers').addEventListener('click', e => {
    const li = e.target.closest('.layer');
    if (li && li.dataset.i !== '') playClip(+li.dataset.i);
  });
  // Hold to peek: the answer shows only while a finger is on the button.
  const PEEK_LABEL = '👁 Hold to peek at the answer';
  function showPeek(e) {
    e.preventDefault();
    try { $('#peek').setPointerCapture(e.pointerId); } catch (err) {} // a small finger slide shouldn't hide it
    const s = game.song;
    $('#peek').textContent = `${s.title} — ${s.artist}`;
    $('#peek').classList.add('on');
  }
  function hidePeek() {
    $('#peek').textContent = PEEK_LABEL;
    $('#peek').classList.remove('on');
  }
  $('#peek').addEventListener('pointerdown', showPeek);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => $('#peek').addEventListener(t, hidePeek));
  $('#peek').addEventListener('contextmenu', e => e.preventDefault());

  $('#next').addEventListener('click', nextLayer);
  $('#reveal').addEventListener('click', reveal);
  $('#skip-song').addEventListener('click', () => {
    stopAudio();
    game.queue.splice(game.i, 1);
    if (game.i >= game.queue.length) endGame(); else startRound();
  });
  $('#award-btns').addEventListener('click', e => {
    const b = e.target.closest('button[data-p]');
    if (b) finishRound(b.dataset.p || null);
  });
  $('#quit').addEventListener('click', () => { if (confirm('End this game and see the scores?')) endGame(); });
  $('#again').addEventListener('click', startGame);
  $('#home').addEventListener('click', () => { renderSetup(); show('setup'); });
  $('#resume-yes').addEventListener('click', resumeGame);
  $('#resume-no').addEventListener('click', () => { clearGame(); renderResume(); });

  /* ---------- Boot ---------- */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
  loadLibrary().then(refreshCached).then(renderSetup);
})();
</script>
</body>
</html>
